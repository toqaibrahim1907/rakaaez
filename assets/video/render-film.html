<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Render Al Rakaez brand film</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0c1d2a;color:#edf6fb;font:15px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:24px}.panel{width:min(100%,920px);padding:24px;border:1px solid #ffffff20;border-radius:18px;background:#132b3d;box-shadow:0 24px 70px #0007}h1{font-size:22px;margin:0 0 6px}.sub{color:#b3c5d0;margin:0 0 18px}.preview{width:100%;display:block;background:#000;border-radius:12px;aspect-ratio:16/9}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}.button{border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;color:white;background:#0786cf;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}.status{color:#b3c5d0;font-size:13px}.download{display:none;color:#90d3f4;font-weight:700}.spec{margin-top:14px;color:#92aaba;font-size:12px}
  </style>
</head>
<body>
  <main class="panel">
    <h1>Al Rakaez Al Bashariya — brand film</h1>
    <p class="sub">8.00 seconds · 1920 × 1080 · original supplied logo held still for the final second</p>
    <canvas id="film" class="preview" width="1920" height="1080"></canvas>
    <div class="bar"><button id="render" class="button">Render and save video</button><span id="status" class="status">Loading scene frames…</span><a id="download" class="download" download>Download video</a></div>
    <div class="spec">Timeline: home preparation 0–2s · finished room 2–4s · customer arrival 4–6s · blue end card 6–7s · static supplied logo 7–8s</div>
    <video id="result" controls class="preview" style="display:none;margin-top:16px"></video>
  </main>
<script>
const W=1920,H=1080,FPS=30,DURATION=8;
const canvas=document.querySelector('#film'),ctx=canvas.getContext('2d',{alpha:false});
const statusEl=document.querySelector('#status'),button=document.querySelector('#render'),downloadEl=document.querySelector('#download'),result=document.querySelector('#result');
const files=['/assets/video/frames/01-worker-finishing.png','/assets/video/frames/02-living-room-details.png','/assets/video/frames/03-customer-arrives.png'];
const photos=files.map(src=>{const img=new Image();img.src=src;return img});
const logo=new Image();logo.src='/assets/images/logo-refined-square.png';
const ready=Promise.all([...photos,logo].map(img=>img.decode()));
function drawCover(img,p=0,direction=1){
  const scale=Math.max(W/img.width,H/img.height)*(1.015+.035*p);const dw=img.width*scale,dh=img.height*scale;
  const x=(W-dw)/2+direction*(p-.5)*24,y=(H-dh)/2-(p-.5)*10;
  ctx.drawImage(img,x,y,dw,dh);
}
function blueCard(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#087dbb');g.addColorStop(.48,'#078bd6');g.addColorStop(1,'#07558f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function drawAt(t){
  if(t>=7){
    blueCard();const size=1000;ctx.drawImage(logo,(W-size)/2,(H-size)/2,size,size);return;
  }
  if(t<2){drawCover(photos[0],t/2,1);return}
  if(t<4){
    const p=(t-2)/2;
    if(p<.10){drawCover(photos[0],1,1);ctx.globalAlpha=p/.10;drawCover(photos[1],p, -1);ctx.globalAlpha=1}
    else drawCover(photos[1],p,-1);
    return;
  }
  if(t<6){
    const p=(t-4)/2;
    if(p<.10){drawCover(photos[1],1,-1);ctx.globalAlpha=p/.10;drawCover(photos[2],p,1);ctx.globalAlpha=1}
    else drawCover(photos[2],p,1);
    return;
  }
  drawCover(photos[2],1,1);
  const blueProgress=Math.min(1,Math.max(0,(t-6)/.48));
  ctx.globalAlpha=blueProgress;blueCard();ctx.globalAlpha=1;
}
let animation=0;
function preview(){if(!photos.every(i=>i.complete)&&!logo.complete)return;drawAt((performance.now()/1000)%DURATION);animation=requestAnimationFrame(preview)}
ready.then(()=>{statusEl.textContent='Ready';preview()}).catch(()=>{statusEl.textContent='Could not load a scene image'});
button.addEventListener('click',async()=>{
  button.disabled=true;downloadEl.style.display='none';result.style.display='none';statusEl.textContent='Rendering 8-second video…';
  try{
    await ready;cancelAnimationFrame(animation);
    const stream=canvas.captureStream(FPS);
    const mp4='video/mp4;codecs=avc1.42E01E',webm='video/webm;codecs=vp9';
    const mime=MediaRecorder.isTypeSupported(mp4)?mp4:(MediaRecorder.isTypeSupported(webm)?webm:'video/webm');
    const ext=mime.startsWith('video/mp4')?'mp4':'webm';
    const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:16000000});
    const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    recorder.onstop=async()=>{
      stream.getTracks().forEach(track=>track.stop());
      const blob=new Blob(chunks,{type:mime});const localUrl=URL.createObjectURL(blob);
      result.src=localUrl;result.style.display='block';result.load();
      statusEl.textContent=`Video rendered · ${(blob.size/1048576).toFixed(1)} MB · ${ext.toUpperCase()}`;
      try{
        const response=await fetch(`/save?name=al-rakaez-brand-film.${ext}`,{method:'POST',headers:{'Content-Type':mime},body:blob});
        if(!response.ok)throw new Error('Could not save to the project folder');
        statusEl.textContent+=` · Saved in assets/video`;
      }catch(error){
        downloadEl.href=localUrl;downloadEl.download=`al-rakaez-brand-film.${ext}`;downloadEl.style.display='inline';
        statusEl.textContent+=' · Use Download video to save the file';
      }
      button.disabled=false;preview();
    };
    recorder.start(100);
    const started=performance.now();let raf;
    function capture(){const t=(performance.now()-started)/1000;drawAt(Math.min(t,DURATION));if(t<DURATION)raf=requestAnimationFrame(capture);else{cancelAnimationFrame(raf);recorder.stop()}}
    capture();
  }catch(error){statusEl.textContent=error.message||'Unable to render the video';button.disabled=false;preview()}
});
</script>
</body>
</html>
