<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">شركة الركائز البشرية للاستقدام — Alrakayiz Albasharia</title>
  <desc id="desc">الشعار المحسّن بحركة دخول خفيفة ونبض هادئ للرمز.</desc>
  <image id="brand-mark" href="logo-mark-refined.png" x="200" y="12" width="600" height="600" preserveAspectRatio="xMidYMid meet"/>
  <text id="arabic-name" x="500" y="724" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Cairo, 'Noto Sans Arabic', Tahoma, sans-serif" font-size="48" font-weight="800" fill="#102f4d">شركة الركائز البشرية للاستقدام</text>
  <path d="M420 774h160" stroke="#0786cf" stroke-width="4" stroke-linecap="round"/>
  <text id="english-name" x="500" y="842" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700" letter-spacing=".2" fill="#0786cf">Alrakayiz Albasharia</text>
  <style>
    #brand-mark{transform-origin:500px 312px;animation:mark-arrive 1s cubic-bezier(.2,.75,.25,1) both,mark-breathe 7s ease-in-out 1s infinite}
    #arabic-name,#english-name{opacity:0;animation:name-arrive .8s ease-out .35s forwards}
    @keyframes mark-arrive{from{opacity:0;transform:translateY(10px) scale(.975)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes mark-breathe{0%,100%{filter:brightness(1);transform:scale(1)}50%{filter:brightness(1.045);transform:scale(1.006)}}
    @keyframes name-arrive{to{opacity:1}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important}}
  </style>
</svg>
