<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الموظفين | الركائز البشرية</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="css/admin.css" rel="stylesheet"><style>body{min-height:100vh;display:grid;place-items:center;background:#f2f6f9}.login-card{width:min(440px,calc(100% - 32px));padding:34px;background:#fff;border:1px solid #dce7ef;border-radius:22px;box-shadow:0 18px 60px #17395714}.login-card img{width:58px}.login-card h1{font-size:1.5rem;margin-top:20px}.login-card p{color:#668099}.login-card label{display:block;margin:14px 0 6px}.login-card input{width:100%;padding:12px;border:1px solid #d5e0e9;border-radius:10px}.login-card button{width:100%;margin-top:20px}.login-status{margin-top:14px;color:#ae3e33}</style>  <link href="../css/mobile.css" rel="stylesheet">
</head>
<body><main class="login-card"><img src="../assets/images/logo-mark-refined.png" alt="الركائز البشرية"><h1>دخول الموظفين</h1><p>استخدم حسابًا أنشأه مدير النظام.</p><div id="setupNotice" class="alert alert-info d-none">إعداد Supabase غير مكتمل. أضف Project URL والمفتاح العام في <code>js/supabase-config.js</code> ثم أعد تحميل الصفحة.</div><form id="loginForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button class="button-primary" type="submit">تسجيل الدخول</button></form><div class="login-status" id="loginStatus" role="status"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/supabase-client.js"></script><script>
const b=window.RakaezBackend,form=document.querySelector('#loginForm'),status=document.querySelector('#loginStatus');if(!b.ready){document.querySelector('#setupNotice').classList.remove('d-none');form.querySelector('button').disabled=true}form.addEventListener('submit',async e=>{e.preventDefault();if(!b.ready)return;const {error}=await b.client.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error){status.textContent='تعذر تسجيل الدخول. تحقق من بيانات الحساب.';return}location.href='index.html'});if(new URLSearchParams(location.search).has('error'))status.textContent='الحساب غير نشط أو لا يملك صلاحية دخول لوحة الإدارة.';
</script></body></html>
