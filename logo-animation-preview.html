<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>حركة شعار الركائز البشرية</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111a;color:#eaf3fa;font-family:Arial,sans-serif}.stage{width:min(92vw,720px);padding:28px;border:1px solid #ffffff1c;border-radius:26px;background:radial-gradient(ellipse at 50% 40%,#092d43 0%,#06121d 68%);box-shadow:0 24px 80px #0008;text-align:center}.stage object{display:block;width:min(100%,600px);height:auto;aspect-ratio:1;margin:auto;border:0}.stage p{margin:18px 0 0;color:#afc2cf;font-size:14px;line-height:1.8}
  </style>
</head>
<body>
  <main class="stage">
    <object data="assets/images/logo-animated.svg" type="image/svg+xml" aria-label="الشعار المتحرك لشركة الركائز البشرية للاستقدام"></object>
    <p>تظهر الحركة عند فتح الملف في المتصفح. احفظ نسخة PNG ثابتة أو ملف SVG المتحرك معًا عند استخدام الشعار.</p>
  </main>
</body>
</html>
