<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تصميم شعار الركائز البشرية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px;background:#f1f5f8;color:#102f4d;font-family:Cairo,sans-serif;display:grid;place-items:center}.wrap{width:min(100%,980px)}h1{font-size:24px;margin:0 0 8px}.sub{color:#60788b;margin:0 0 24px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{min-height:470px;border-radius:22px;display:grid;place-items:center;padding:24px;box-shadow:0 14px 38px #102f4d12}.light{background:#fff}.dark{background:#102f4d}.card object{width:min(100%,390px);height:auto;aspect-ratio:1;border:0}.label{font-size:13px;color:#678095;margin-top:12px}.dark .label{color:#c5d7e3}@media(max-width:650px){.cards{grid-template-columns:1fr}.card{min-height:390px}}
  </style>
</head>
<body><main class="wrap"><h1>شعار الركائز البشرية</h1><p class="sub">رمز أنظف، ألوان زرقاء وكحلية، وخلفية شفافة.</p><div class="cards"><section class="card light"><object data="assets/images/logo-animated.svg" type="image/svg+xml" aria-label="شعار الركائز البشرية على خلفية فاتحة"></object><div class="label">النسخة المتحركة — تظهر عند العرض في المتصفح</div></section><section class="card dark"><object data="assets/images/logo-refined-dark.svg" type="image/svg+xml" aria-label="الشعار الثابت بلون مناسب للخلفية الداكنة"></object><div class="label">النسخة الثابتة — للأصول والخلفيات الداكنة</div></section></div></main></body>
</html>
